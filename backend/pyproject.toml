[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stuttercut"
version = "0.1.0"
description = "Local web app that detects and cuts stutters in short Vietnamese videos."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",  # FastAPI TestClient
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
]
# ASR spike (LEARNING-205) only; see docs/guides/running-eval.md for CUDA torch.
eval = [
    "crisperwhisper[transformers]>=2.1.0",
    "faster-whisper>=1.1",
    "psutil>=6.0",
    "torch>=2.4",
    "transformers>=4.56",
]

[tool.hatch.build.targets.wheel]
packages = ["stuttercut"]
