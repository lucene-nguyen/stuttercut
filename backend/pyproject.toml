[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stuttercut"
version = "0.1.0"
description = "Local web app that detects and cuts stutters in short Vietnamese videos."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8",  # LLM review of cut candidates (LEARNING-208); text only
    "fastapi>=0.115",
    "platformdirs>=4.2",
    "psutil>=6.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",  # FastAPI TestClient
    "hypothesis>=6.100",
    "mypy>=1.11",
    "numpy>=1.26",  # eval/ CTC alignment tests
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-psutil>=6.0",
]
# The real transcriber (CrisperWhisper 2.0, ADR 0002). Tests use the fake one and skip this.
# CUDA on Windows needs the CUDA torch wheel: docs/guides/setup-windows.md.
asr = [
    "crisperwhisper[transformers]>=2.1.0",
    "silero-vad>=6.0",  # voice activity detection for cut candidates (MIT, model bundled)
    "torch>=2.4",
]
# ASR spike (LEARNING-205) only; see docs/guides/running-eval.md for CUDA torch.
eval = [
    "crisperwhisper[transformers]>=2.1.0",
    "faster-whisper>=1.1",
    "torch>=2.4",
    "transformers>=4.56",
]

[tool.hatch.build.targets.wheel]
packages = ["stuttercut"]
