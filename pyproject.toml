# Tool config only, shared by the whole repo so `ruff`, `mypy` and `pytest`
# work from the repo root. The installable package lives in backend/pyproject.toml.

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["stuttercut"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend/stuttercut"]

[[tool.mypy.overrides]]
# torch, crisperwhisper and silero-vad are optional (the "asr"/"eval" extras) and absent in CI.
module = ["torch", "torch.*", "crisperwhisper", "crisperwhisper.*", "silero_vad", "silero_vad.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # makes the eval/ package importable
addopts = ["--import-mode=importlib", "--strict-markers", "-m", "not golden"]
markers = ["golden: accuracy eval on real clips; loads the real model (slow)"]
